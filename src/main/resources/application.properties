spring.application.name=tour-trip-api
server.port=${PORT:8080}

# Logging (writes to ./logs/application.log so mail/OTP activity is inspectable)
logging.file.name=logs/application.log

# PostgreSQL Database Connection (override with DB_URL / DB_USERNAME / DB_PASSWORD in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tour-trip}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver


# Hikari connection pool — retry on cold start (Render free instance + Neon pooler
# can be slow to accept the first connection; without retries the app exits before
# the DB is reachable).
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
# Pin the dialect so Hibernate does not need a live JDBC metadata probe at startup.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.initialization-fail-timeout=180000


# JWT Configuration (override JWT_SECRET in production — generate a long random string)
app.jwt.secret=${JWT_SECRET:TourTripApiSuperSecretKeyForJwtTokenGenerationSecurity123456789!}
app.jwt.expirationMs=86400000

# CORS — comma-separated list of allowed frontend origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Mail sender (override MAIL_USERNAME / MAIL_PASSWORD in production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:sinhporsurii@gmail.com}
spring.mail.password=${MAIL_PASSWORD:pwue nwcd enmv nenz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Cloudinary — persistent cloud image storage.
# Leave blank to fall back to the local ./uploads folder (handy for offline dev).
# In production set CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:tour-trip}
