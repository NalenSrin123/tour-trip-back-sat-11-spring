services:
  - type: web
    name: tour-trip-api
    runtime: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -XX:MaxRAMPercentage=75.0 -jar target/tour-trip-api-*.jar
    healthCheckPath: /api/v1/categories
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
